[project]
name = "agent-edge-serving"
version = "0.1.0"
description = "Replay harness and FIFO baselines for memory-aware scheduling of multi-step LLM agents"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "tokenizers==0.22.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
