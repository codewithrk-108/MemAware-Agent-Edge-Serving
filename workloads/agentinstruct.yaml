# Public-dataset workload: AgentInstruct (Zeng et al. 2023, https://huggingface.co/datasets/zai-org/AgentInstruct),
# 1,866 multi-turn agent trajectories in six environments.
#
# Mapping to agent tasks:
#   - turns before the first agent turn with loss=True (instruction + in-context demonstration + the task) form
#     the first model call; they are identical for all tasks of an environment, so they are a reusable prefix
#   - every agent turn with loss=True is one model call, its token length is the number of tokens generated
#   - the environment message after an agent turn is the tool result appended before the next call
#
# ASSUMPTION: the dataset has no timing, tool latency is modeled per environment as lognormal(median, sigma)
# seconds. Values are rough estimates of each environment's tool, scale them with the runner's --delay-scale.

seed: 11
max_context: 12000      # drop tasks whose final context exceeds this many tokens

environments:
  os:       {median: 0.5, sigma: 0.8}   # shell command in a container
  db:       {median: 0.3, sigma: 0.6}   # SQL query
  alfworld: {median: 0.2, sigma: 0.5}   # text game environment step
  webshop:  {median: 1.5, sigma: 0.6}   # web search / page load
  kg:       {median: 1.0, sigma: 0.6}   # knowledge-graph API call
  mind2web: {median: 1.0, sigma: 0.6}   # single step, no tool call in practice
