# Synthetic agent workload: a mixture of short and long contexts, short and long responses,
# single- and multi-step tasks, with controlled tool delays.
#
# Per task class:
#   weight         share of tasks
#   prefix         tokens of a system prompt shared by every task of the class (tool descriptions, instructions)
#   context        [min, max] task-specific tokens in the first step (user request, retrieved documents)
#   steps          [min, max] model calls per task
#   gen            [min, max] tokens generated per model call
#   tool_tokens    [min, max] tokens a tool returns, appended before the next model call
#   tool_delay     lognormal tool latency in seconds: median and sigma (log-space std dev)
# Ranges are uniform integers. All randomness comes from `seed`.

seed: 7
n_tasks: 400

classes:
  chat:              # short context, short answers, one tool call at most
    weight: 0.35
    prefix: 256
    context: [64, 512]
    steps: [1, 2]
    gen: [32, 128]
    tool_tokens: [32, 128]
    tool_delay: {median: 0.5, sigma: 0.6}

  rag:               # long context from retrieved documents, short answers
    weight: 0.20
    prefix: 256
    context: [2048, 6144]
    steps: [1, 2]
    gen: [64, 256]
    tool_tokens: [512, 1536]
    tool_delay: {median: 1.0, sigma: 0.5}

  react_agent:       # multi-step tool use, context grows every step
    weight: 0.30
    prefix: 1024
    context: [128, 512]
    steps: [3, 8]
    gen: [32, 128]
    tool_tokens: [64, 512]
    tool_delay: {median: 2.0, sigma: 0.8}

  long_gen:          # long responses (code, reports) with an execution step
    weight: 0.15
    prefix: 256
    context: [256, 1024]
    steps: [1, 3]
    gen: [384, 768]
    tool_tokens: [64, 256]
    tool_delay: {median: 3.0, sigma: 0.6}
